# Pull request checks: formatting, vet, Go tests under the race detector
# (including the domain import rule in internal/domain/imports_test.go), static
# analysis (golangci-lint with gosec), known vulnerabilities (govulncheck and
# osv-scanner), the OpenCode plugin test, and an architecture gate that compares archsieve snapshots of the base
# and the head. CodeQL runs in codeql.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (gofmt, vet, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The race detector instruments every test run (dynamic analysis).
      - name: go test
        run: go test -race -count=1 ./...

  lint:
    name: static analysis (golangci-lint, gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Linters and their exclusions are in .golangci.yml; any finding fails.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  govulncheck:
    name: known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Fails when code veil actually calls (including the standard library of
      # the toolchain in go.mod) has a known vulnerability in the Go
      # vulnerability database. The version is checked against sum.golang.org.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  osv:
    name: known vulnerabilities (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The check OpenSSF Scorecard's Vulnerabilities check runs: every
      # lockfile in the repository (go.mod and research/ner-benchmark/uv.lock)
      # against OSV.dev, WITHOUT reachability analysis, so a vulnerable module
      # fails here even when govulncheck finds no call to it. A finding that does
      # not apply is accepted in an osv-scanner.toml next to its lockfile
      # ([[IgnoredVulns]] with a reason and ignoreUntil), never by skipping this.
      # osv-scanner v2.7.1 needs Go 1.27.3 to build; setup-go sets
      # GOTOOLCHAIN=local, so name that toolchain (downloaded and checked
      # against sum.golang.org). veil itself still builds with go.mod's.
      - name: osv-scanner
        env:
          GOTOOLCHAIN: go1.27.3
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1 scan source --no-call-analysis=go --recursive .

  plugin:
    name: opencode plugin test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: node --test
        run: node --test adapters/opencode/veil-plugin.test.mjs

  architecture:
    name: architecture gate (archsieve)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # archsieve is not published on npm; it is checked out from git at the
      # commit of its v0.6.0 tag, and its dependencies come from its lockfile.
      ARCHSIEVE_REF: 41a2bf85b866ae0765c11c46c5b86d031b5d9860 # v0.6.0
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: veil
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FullFran/archsieve
          ref: ${{ env.ARCHSIEVE_REF }}
          path: archsieve
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: veil/go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install archsieve
        working-directory: archsieve
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Snapshot base and head
        run: |
          mkdir -p snapshots
          node archsieve/bin/archsieve.mjs scan veil --ref "$BASE_SHA" -o snapshots/base.json
          node archsieve/bin/archsieve.mjs scan veil --ref "$HEAD_SHA" -o snapshots/head.json

      - name: Diff (fails on new error findings)
        run: |
          set +e
          node archsieve/bin/archsieve.mjs diff snapshots/base.json snapshots/head.json \
            --format md -o snapshots/diff.md --fail-on error
          status=$?
          set -e
          cat snapshots/diff.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archsieve-snapshots
          path: snapshots/
          retention-days: 14
          if-no-files-found: ignore
