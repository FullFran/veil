# Publishes prebuilt veil binaries, the OpenCode plugin and SHA256SUMS as
# release assets, so consumers (for example a bundle builder) can install
# veil without a Go toolchain. GoReleaser (.goreleaser.yaml) builds the
# binaries reproducibly; this workflow does everything else.
#
# Supply chain: every asset listed in SHA256SUMS gets SLSA v1 build provenance
# (an in-toto statement, Sigstore-signed with this workflow's GitHub OIDC
# identity) published as veil.intoto.jsonl and stored as a GitHub attestation,
# and SHA256SUMS itself gets a keyless cosign signature, SHA256SUMS.sigstore.json.
# SHA256SUMS is computed before those files exist, so its content and the
# names of the existing assets do not change.
#
# Release notes are the tag's section of CHANGELOG.md (Keep a Changelog) on the
# default branch, so a tag cut before its notes were written still gets them.
# The release fails before building anything if that section is missing.
#
# Runs on a tag push, or by hand for an EXISTING tag (workflow_dispatch with
# `tag`), which builds that tag's sources without moving it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Create the release and upload its assets.
      contents: write
      # Request Sigstore signing certificates (Fulcio) with the workflow's OIDC token.
      id-token: write
      # Store the provenance attestation in the repository's attestation API.
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          gh api "repos/$REPO/contents/CHANGELOG.md" -H "Accept: application/vnd.github.raw" |
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { exit }
              found { print }
            ' > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      # GoReleaser only builds (.goreleaser.yaml disables its release,
      # checksums and changelog): the binaries go through the same checksum,
      # provenance, signature and verification steps below as before.
      - name: Build binaries (GoReleaser)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}

      - name: Collect the assets
        run: |
          mkdir -p dist
          jq -r '.[] | select(.type == "Binary" and (.name | startswith("veil-"))) | "\(.path) \(.name)"' \
            .goreleaser-dist/artifacts.json |
            while read -r path name; do cp "$path" "dist/$name"; done
          test "$(find dist -type f | wc -l)" -eq 6
          cp adapters/opencode/veil-plugin.js dist/veil-plugin.js
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Smoke-test the linux/amd64 binary
        run: |
          out="$(echo '{"event":"chat.message","sessionID":"ci","fields":{"text":"hola"}}' | ./dist/veil-linux-amd64 opencode)"
          echo "$out"
          echo "$out" | grep -q '"action"'

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Add the provenance bundle to the assets
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/veil.intoto.jsonl

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      # The same commands the README gives hosts, run on the files about to be
      # published, so a release never ships a signature that does not verify.
      - name: Verify signatures and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd dist
          cosign verify-blob SHA256SUMS \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check SHA256SUMS
          while read -r _ name; do
            gh attestation verify "${name#\*}" \
              --bundle veil.intoto.jsonl \
              --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --deny-self-hosted-runners < /dev/null
          done < SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file "$notes"
          fi
