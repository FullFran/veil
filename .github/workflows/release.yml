# Publishes prebuilt veil binaries, the OpenCode plugin and SHA256SUMS as
# release assets, so consumers (for example a bundle builder) can install
# veil without a Go toolchain.
#
# Runs on a tag push, or by hand for an EXISTING tag (workflow_dispatch with
# `tag`), which builds that tag's sources without moving it.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG" >&2; exit 1 ;; esac
          gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" > /dev/null

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: go test ./...

      - name: Build binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w" -o "dist/veil-${os}-${arch}${ext}" ./cmd/veil
          done
          cp adapters/opencode/veil-plugin.js dist/veil-plugin.js
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - name: Smoke-test the linux/amd64 binary
        run: |
          out="$(echo '{"event":"chat.message","sessionID":"ci","fields":{"text":"hola"}}' | ./dist/veil-linux-amd64 opencode)"
          echo "$out"
          echo "$out" | grep -q '"action"'

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
              --notes "Prebuilt veil binaries (CGO_ENABLED=0), the OpenCode plugin and SHA256SUMS for $TAG."
          fi
