[project]
name = "veil-ner-benchmark"
version = "0.1.0"
description = "Research harness: local NER/PII models against veil's Spanish corpus (FullFran/veil#3). Not part of veil."
requires-python = ">=3.12,<3.13"
dependencies = [
  "opf @ git+https://github.com/openai/privacy-filter@f7f00ca7fb869683eb732c010299d901457f19c3",
  "gliner2==2.1.0",
  "presidio-analyzer==2.2.366",
  "spacy==3.8.18",
  "es_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
  "es_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl",
  "torch==2.15.0",
  "transformers>=5.6,<6",
  "json-repair==0.64.9",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
